name: Mihomo Rootless

on:
  schedule:
    - cron: "0 0 * * SUN"
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: mihomo

jobs:
  build:
    if: github.server_url == 'https://github.com' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v5

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Resolve latest stable release
        id: upstream
        run: |
          version="$(curl -fsSL https://api.github.com/repos/MetaCubeX/mihomo/releases/latest | jq -er '.tag_name')"
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Login to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: app/mihomo
          file: app/mihomo/Dockerfile
          pull: true
          push: true
          build-args: |
            MIHOMO_VERSION=${{ steps.upstream.outputs.version }}
          tags: |
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:${{ steps.upstream.outputs.version }}
            ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}:latest
